<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indicator Library: Semantic Models</title>
<style>

:root{
  --bg:#F7F7F5; --surface:#FFFFFF; --text:#1F2A44; --muted:#5B6270; --accent:#4A6FA5; --contrast:#A5654E; --gray:#D9DDE3;
  --line:#E4E6EA; --track:#EEF0F3; --tint:#EDF1F7; --tintText:#3B5B8C; --accentHover:#3B5B8C;
  --calloutBorder:#C9D3E3; --calloutText:#1F2A44; --btnText:#FFFFFF;
  --dark:#1F2A44; --darkText:#E6E9EF; --darkHead:#FFFFFF; --darkMuted:#A3AAB6; --darkBorder:#3A4660;
  /* legacy names used by the existing rules, mapped onto the theme */
  --navy:var(--accent); --blue:var(--accent); --teal:var(--accent); --teal2:var(--accent);
  --mist:var(--tint); --ice:var(--calloutBorder); --rust:var(--contrast); --amber:var(--contrast); --red:var(--contrast);
  --plum:var(--muted); --slate:var(--muted); --grey:var(--gray); --grid:var(--track); --ink:var(--text); --panel:var(--surface);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.35}
header{background:var(--accent);color:#fff;padding:20px 57px 14px}
header h1{margin:0;font-size:30px;font-weight:700;line-height:1}
header p{margin:6px 0 0;font-size:16px;opacity:.9}
header .meta{font-size:13px;margin-top:8px;opacity:.8}
.bar-top{background:var(--panel);border-bottom:1px solid var(--mist);padding:10px 57px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.bar-top label{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--slate);cursor:pointer}
input[type=search],select,input[type=number]{font:inherit;padding:6px 10px;border:1px solid var(--grey);border-radius:8px;background:#fff;color:var(--ink)}
input[type=search]{min-width:260px}
input[type=number]{width:70px}
button{font:inherit;border:1px solid var(--navy);background:var(--navy);color:#fff;padding:6px 14px;border-radius:8px;cursor:pointer}
button.ghost{background:#fff;color:var(--navy)}
.slicers{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;padding:12px 57px;background:var(--panel);border-bottom:1px solid var(--mist)}
.slc{display:flex;flex-direction:column;gap:3px;min-width:0}
.slc-l{font-size:12.5px;font-weight:600;color:var(--slate)}
.cb{position:relative}
.cb input{width:250px;font:inherit;padding:6px 9px;border:1px solid var(--grey);border-radius:8px;background:#fff;color:var(--ink)}
.cb input:focus{outline:2px solid var(--teal2);outline-offset:-1px}
.cb input.on{border-color:var(--navy);background:#EDF1F7;font-weight:600}
.cb-list{position:absolute;left:0;top:calc(100% + 2px);min-width:100%;width:max-content;max-width:min(680px,92vw);max-height:340px;overflow:auto;background:#fff;border:1px solid var(--navy);z-index:40}
.cb-item{padding:6px 10px;cursor:pointer;font-size:14px;line-height:1.3;border-bottom:1px solid var(--grid)}
.cb-item:hover,.cb-item.act{background:var(--mist)}
.cb-item.sel{font-weight:700;color:var(--navy)}
.cb-all{color:var(--slate);font-style:italic}
.cb-more{padding:6px 10px;font-size:12.5px;color:var(--slate)}
.slicers button{padding:6px 14px;height:34px}
.slicers button:disabled{opacity:.4;cursor:default}
nav{display:flex;flex-wrap:wrap;padding:0 57px;border-bottom:2px solid var(--navy);background:#fff}
nav button{background:#fff;color:var(--navy);border:0;border-bottom:4px solid transparent;padding:12px 16px;font-size:16px;font-weight:600;margin-bottom:-2px}
nav button.on{border-bottom-color:var(--navy);background:var(--mist)}
main{padding:22px 57px 60px}
h2{color:var(--navy);margin:0 0 4px;font-size:22px}
h3{color:var(--blue);margin:20px 0 8px;font-size:17px}
.sub{color:var(--slate);margin:0 0 14px;max-width:920px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:14px 0 8px}
.kpi{background:var(--panel);padding:12px 14px;border-left:6px solid var(--navy)}
.kpi b{display:block;font-size:28px;color:var(--navy);line-height:1.1}
.kpi span{color:var(--slate);font-size:13px}
.kpi.warn{border-left-color:var(--amber)} .kpi.bad{border-left-color:var(--red)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:26px}
.bars .row{display:grid;grid-template-columns:minmax(120px,40%) 1fr 64px;gap:8px;align-items:center;margin:4px 0;font-size:14px}
.bars .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .trk{background:var(--grid);height:16px}
.bars .trk i{display:block;height:100%;background:var(--navy)}
.bars .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--slate)}
.bars .row.click{cursor:pointer}
.bars .row.click:hover .lbl{text-decoration:underline}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--navy);color:#fff;text-align:left;padding:7px 9px;white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
td{padding:6px 9px;border-bottom:1px solid var(--grid);vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--panel)}
tr.row.open td{background:var(--mist)}
tr.detail>td{background:var(--panel);padding:14px 18px;border-bottom:2px solid var(--navy)}
.badge{display:inline-block;padding:2px 8px;font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap}
.v-Consistent{background:var(--navy)} .v-SameLogic{background:var(--amber)}
.v-SameSource{background:var(--teal2)} .v-Both{background:var(--red)} .v-Single{background:var(--grey);color:var(--ink)}
.sys{display:inline-block;padding:1px 7px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap;margin:1px 3px 1px 0}
.s-oms{background:var(--navy)} .s-coded{background:var(--teal2)} .s-otherdw{background:var(--slate)}
.s-pbimodel{background:var(--plum)} .s-lakehouse{background:var(--blue)} .s-files{background:var(--rust)}
.s-web{background:var(--amber)} .s-none{background:var(--grey);color:var(--ink)} .s-mixed{background:var(--ink)}
.st{display:inline-block;padding:1px 7px;font-size:12.5px;white-space:nowrap;border:1px solid var(--grey);color:var(--ink)}
.st-ok{border-color:var(--navy);color:var(--navy)} .st-bad{border-color:var(--red);color:var(--red);font-weight:700}
.st-warn{border-color:var(--amber);color:#3B5B8C}
.pri-High{color:var(--red);font-weight:700} .pri-Medium{color:#3B5B8C;font-weight:700} .pri-Low{color:var(--slate)}
.score{display:inline-block;min-width:34px;text-align:center;padding:1px 6px;font-weight:700;color:#fff;background:var(--navy)}
.score.mid{background:var(--amber)} .score.low{background:var(--red)}
.chip{display:inline-block;background:var(--mist);color:var(--navy);padding:1px 7px;margin:1px 3px 1px 0;font-size:12.5px;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.chip.k-Excel,.chip.k-CSV,.chip.k-Folder,.chip.k-SharePoint{background:#EDF1F7;color:#3B5B8C}
.chip.k-Web{background:#EDF1F7;color:var(--plum)}
.chip.k-DirectLake{background:#EDF1F7;color:#3B5B8C}
.chips-more{color:var(--slate);font-size:12.5px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px;align-items:center}
.filters button{background:#fff;color:var(--navy);padding:4px 12px}
.filters button.on{background:var(--navy);color:#fff}
.filters label{font-size:14px;color:var(--slate);display:flex;gap:6px;align-items:center}
pre.code{margin:4px 0 10px;padding:10px;background:#fff;border:1px solid var(--mist);max-height:260px;overflow:auto;font:12.5px/1.45 Consolas,"Courier New",monospace;white-space:pre}
pre.code .dl{background:#EDF1F7;display:block}
.note{color:var(--slate);font-size:13px}
.empty{color:var(--slate);padding:18px 0}
.more{margin:14px 0}
details{margin:4px 0} summary{cursor:pointer;color:var(--navy)}
details.panel{background:var(--panel);border-left:6px solid var(--teal2);padding:8px 14px;margin:10px 0;max-width:980px}
details.panel[open]{padding-bottom:12px}
.weights{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px}
.weights label{font-size:13.5px;color:var(--slate);display:flex;flex-direction:column;gap:2px}
.callout{border-left:6px solid var(--amber);background:#EDF1F7;padding:10px 14px;margin:12px 0;max-width:920px}
.ctx{background:#fff;border:1px solid var(--mist);padding:8px 12px;margin:8px 0;display:grid;grid-template-columns:150px 1fr;gap:3px 12px;font-size:14px}
.ctx b{color:var(--navy)}
.rec{background:#fff;border-left:6px solid var(--navy);padding:8px 12px;margin:8px 0}
.rec ul{margin:4px 0;padding-left:18px}
a{color:var(--navy)}
footer{padding:16px 57px;color:var(--slate);font-size:12.5px;border-top:1px solid var(--mist)}
@media (max-width:700px){header,.bar-top,.slicers,nav,main,footer{padding-left:16px;padding-right:16px}.cb input{width:100%}.slc{flex:1 1 100%}input[type=search]{min-width:0;width:100%}}

.layout{display:grid;grid-template-columns:var(--side-w,330px) 14px minmax(0,1fr);gap:0;align-items:start}
.layout.collapsed{grid-template-columns:14px minmax(0,1fr)}
.layout.collapsed .side{display:none}
.rz{position:sticky;top:0;height:100vh;width:14px;cursor:col-resize;background:var(--panel);border-left:1px solid var(--mist);border-right:1px solid var(--mist);display:flex;flex-direction:column;align-items:center;user-select:none}
.rz:hover{background:var(--mist)}
.rz button{margin-top:10px;width:14px;height:46px;padding:0;font-size:15px;line-height:1;border:0;background:var(--navy);color:#fff;cursor:pointer}
.layout.collapsed .rz{cursor:default}
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--mist);background:var(--panel);padding:12px 14px}
.side input[type=search]{width:100%;min-width:0;margin-bottom:8px}
.side details{margin:2px 0}
.side summary{font-weight:700;color:var(--navy);padding:4px 0}
.side .mi{display:flex;justify-content:space-between;gap:8px;padding:4px 8px;cursor:pointer;border-left:4px solid transparent;font-size:14px}
.side .mi:hover{background:var(--mist)}
.side .mi.on{background:var(--mist);border-left-color:var(--navy);font-weight:700}
.side .mi .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .mi .c{color:var(--slate);font-size:12.5px;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--grey)}
.dot.ok{background:var(--navy)} .dot.bad{background:var(--red)} .dot.warn{background:var(--amber)}
.stage{padding:20px 34px 60px;min-width:0}
.crumb{color:var(--slate);font-size:14px;margin-bottom:2px}
.sec{margin-top:26px}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:8px 0 4px}
.flow>div{background:var(--panel);border-top:5px solid var(--navy);padding:10px 12px}
.flow>div:nth-child(2){border-top-color:var(--teal2)} .flow>div:nth-child(3){border-top-color:var(--plum)}
.flow b{display:block;font-size:26px;color:var(--navy);line-height:1.1}
.flow span{color:var(--slate);font-size:13px}
.flow b .sys{color:#fff;font-size:12px;font-weight:700}
.hit{cursor:pointer;color:var(--navy);text-decoration:underline}
.back{margin:0 0 10px}
.srctbl td:nth-child(3),.srctbl td:nth-child(4),.srctbl td:nth-child(6){max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.open-link{display:inline-block;padding:5px 14px;border:1px solid var(--navy);text-decoration:none;font-weight:600;white-space:nowrap}
.open-link:hover{background:var(--navy);color:#fff}
.modes{display:flex;gap:0}
.modes button{background:#fff;color:var(--navy);padding:6px 16px;font-weight:600}
.modes button.on{background:var(--navy);color:#fff}
.side .grp{font-size:12.5px;color:var(--slate);font-weight:400}
@media (max-width:900px){.layout,.layout.collapsed{grid-template-columns:1fr}.rz{display:none}.layout.collapsed .side{display:block}.side{position:static;height:auto;max-height:340px}.stage{padding:16px}.flow{grid-template-columns:1fr}}

/* Northshore theme overrides */
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.6}
h1,h2,h3,h4{font-weight:600}
h2,h3{color:var(--text)}
a{color:var(--accent);text-decoration:underline} a:hover{color:var(--accentHover)}
header a{color:var(--btnText)}
button:hover{background:var(--accentHover)}
button.ghost{background:var(--surface);color:var(--text);border-color:var(--line)}
button.ghost:hover,nav button:hover{background:var(--tint);color:var(--text)}
footer{background:var(--dark);color:var(--darkText);border-top:0}
footer a{color:var(--darkHead)}
footer code{background:transparent;color:var(--darkHead);border:1px solid var(--darkBorder);border-radius:6px}
nav{border-bottom:1px solid var(--line);background:var(--surface)}
nav button{border-radius:0;border-bottom:3px solid transparent;margin-bottom:-1px;background:var(--surface);color:var(--text)}
nav button:hover{background:var(--tint)}
nav button.on{background:var(--surface);color:var(--accent);border-bottom-color:var(--accent)}
.callout{border-color:var(--calloutBorder);background:var(--tint);color:var(--calloutText)}

/* portfolio polish */
.bar-top:has(#modes){padding-top:0 !important;padding-bottom:0 !important;background:var(--surface) !important;border-bottom:1px solid var(--line) !important}
.modes{gap:0}
.modes button{border:0 !important;border-radius:0 !important;border-bottom:3px solid transparent !important;margin-bottom:-1px;background:transparent !important;color:var(--text) !important;padding:12px 16px;font-size:16px;font-weight:600;box-shadow:none !important}
.modes button:hover{background:var(--tint) !important}
.modes button.on{color:var(--accent) !important;border-bottom-color:var(--accent) !important}

header{background:#1F2A44 !important}
th{background:#1F2A44}
.wrap th{white-space:normal}
.wrap td a,.wrap td code{white-space:normal;overflow-wrap:anywhere}.wrap td span{white-space:normal;overflow-wrap:normal}
.wrap .wrap,td pre{width:0;min-width:100%;overflow-x:auto}
.bar-top:has(#q[style*="hidden"]){display:none}
@media (max-width:700px){table{display:block;overflow-x:auto;max-width:100%}.modes{flex-wrap:wrap}main{overflow-x:hidden}}
</style>
</head>

const D = JSON.parse(document.getElementById('data').textContent);

M.forEach((m, mi) => m.s.forEach(s => srcModels[s].add(mi)));
X.forEach((x, i) => x.s.forEach(s => srcMeas[s].push(i)));
/* ---------- slicers: Workspace, Report, Table (Power Query), Indicator ----------
   Each slicer narrows the set of models; the others cross-filter against it. Type in a box to search, pick a value
   to apply, clear the box to remove. A report's workspace counts for the Workspace slicer even when its model
   lives in another workspace. */
const SL = {ws: '', rep: '', tbl: '', ind: ''};      // chosen labels ('' = all)
const SLK = {ws: -1, rep: -1, tbl: '', ind: ''};     // resolved keys
const SLICERS = [['ws', 'Workspace'], ['rep', 'Report'], ['tbl', 'Table (Power Query)'], ['ind', 'Indicator']];
const slAdd = (map, k, v) => (map.get(k) || map.set(k, new Set()).get(k)).add(v);
const slWsModels = new Map(), slTblModels = new Map(), slIndModels = new Map();
M.forEach((m, mi) => slAdd(slWsModels, m.w, mi));
R.forEach(r => { if (r.m >= 0) slAdd(slWsModels, r.w, r.m); });

function slSets(skip, only) {
  const sets = [];
  if (SL.ws && skip !== 'ws' && !only) sets.push(slWsModels.get(SLK.ws) || new Set());
  if (SL.rep && skip !== 'rep' && !only) sets.push(new Set(R[SLK.rep].m >= 0 ? [R[SLK.rep].m] : []));
  if (SL.tbl && skip !== 'tbl') sets.push(slTblModels.get(SLK.tbl) || new Set());
  if (SL.ind && skip !== 'ind') sets.push(slIndModels.get(SLK.ind) || new Set());
  return slIntersect(sets);
}
const slApply = () => { SL_ALLOWED = slSets(null); SL_TI = slSets(null, true); };
const slOk = mi => !SL_ALLOWED || SL_ALLOWED.has(mi);
const slTbl = t => !SL.tbl || t.n.toLowerCase() === SLK.tbl;
const slInd = x => !SL.ind || x.nn === SLK.ind;
const slReport = ri => {
  const r = R[ri];
  return (!SL.rep || ri === SLK.rep) && (!SL.ws || r.w === SLK.ws) && (!SL_TI || (r.m >= 0 && SL_TI.has(r.m)));
};
const slResolve = {};
function slOptions(key) {
  const allowed = slSets(key), ok = mi => !allowed || allowed.has(mi), out = new Map();
  if (key === 'ws') W.forEach((w, i) => { if ([...(slWsModels.get(i) || [])].some(ok)) out.set(i, w.n); });
  else if (key === 'rep') R.forEach((r, i) => { if (r.m < 0 ? !allowed : ok(r.m)) out.set(i, `${r.n}  [${(W[r.w] || {n: '?'}).n}]`); });

  const host = document.getElementById('slicers');
  if (!host) return;

    return `<div class="slc"><span class="slc-l">${label}</span><div class="cb">

      <div class="cb-list" hidden></div></div></div>`;
  }).join('') + `<button class="ghost" id="slclear" ${Object.values(SL).some(Boolean) ? '' : 'disabled'}>Clear slicers</button>`;
}
// Searchable drop-down panel (wider than the box, so long report names stay readable)
const SL_SHOW = 150;
let slActive = -1;
const slListOf = input => input.parentElement.querySelector('.cb-list');
function slShow(k, text) {
  const input = document.querySelector(`#slicers input[data-sl="${k}"]`), list = slListOf(input);
  const q = text.trim().toLowerCase(), all = [...slResolve[k].values()];
  const hits = q ? all.filter(o => o.v.toLowerCase().includes(q)) : all;
  list.innerHTML = '<div class="cb-item cb-all" data-k="">All (clear this slicer)</div>' +
    hits.slice(0, SL_SHOW).map(o => `<div class="cb-item${o.v === SL[k] ? ' sel' : ''}" data-k="${esc(String(o.key))}">${esc(o.v)}</div>`).join('') +
    (hits.length > SL_SHOW ? `<div class="cb-more">${fmt(hits.length - SL_SHOW)} more: keep typing to narrow</div>` : '') +

  if (dataKey === '') SL[k] = '';

    SL[k] = o.v; SLK[k] = o.key;

}

slHost?.addEventListener('focusin', e => { const k = e.target.dataset?.sl; if (k) { e.target.select(); slShow(k, ''); } });

slHost?.addEventListener('mousedown', e => {
  const it = e.target.closest('.cb-item');
  if (!it) return;

  slPick(it.closest('.cb').querySelector('input').dataset.sl, it.dataset.k);

slHost?.addEventListener('focusout', e => {
  const k = e.target.dataset?.sl;

slHost?.addEventListener('keydown', e => {
  const k = e.target.dataset?.sl;

  const list = slListOf(e.target), items = [...list.querySelectorAll('.cb-item')];
  if (e.key === 'Escape') e.target.blur();
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {

    if (list.hidden) slShow(k, e.target.value);

const sysBadges = ks => ks.length ? ks.map(sysBadge).join('') : sysBadge('none');

function refreshInfo(mi) {

  const when = rf.lt ? `Refreshed ${rf.lt}` : 'No successful refresh in last 10';
  return {cls, dot: rf.ls === 'Completed' ? 'ok' : rf.ls === 'Failed' ? 'bad' : 'warn',
    html: `<span class="st ${cls}" title="Last status: ${esc(rf.ls)}">${esc(when)}</span> <span class="note">${esc(sched)} · last ${rf.hc}: ${rf.ok} ok${rf.fl ? `, ${rf.fl} failed` : ''}</span>`,

const useful = x => !(st.hideUtil && x.u) && slInd(x);

/* ---------- search ---------- */
function search() {
  const q = st.q.trim().toLowerCase();
  if (!q) return null;
  const models = new Set(), meas = [];
  M.forEach((m, mi) => {
    if (!visible(mi)) return;
    if (m.n.toLowerCase().includes(q) || wsOf(mi).n.toLowerCase().includes(q)) models.add(mi);
  });
  T.forEach(t => { if (visible(t.m) && t.n.toLowerCase().includes(q)) models.add(t.m); });
  X.forEach((x, i) => { if (visible(x.m) && useful(x) && x.n.toLowerCase().includes(q)) { meas.push(i); models.add(x.m); } });
  return {models, meas};
}

/* ---------- Tables: every source object (SQL, Excel, CSV, SharePoint, web, upstream Power BI models) ---------- */
const srcVisible = i => [...srcModels[i]].some(visible);
const srcList = () => S.map((_, i) => i).filter(i => (st.kind === 'all' || S[i].k === st.kind) && srcVisible(i) &&
  (!SL.tbl || srcTabs[i].some(t => slTbl(T[t]))));
const srcHit = (i, q) => !q || [S[i].o, S[i].d, S[i].s, S[i].sc || '', S[i].t || ''].some(v => String(v).toLowerCase().includes(q));
const shortServer = s => String(s || '').split('.')[0] || '(no server)';
const visModels = i => [...srcModels[i]].filter(visible);
const isDb = s => s.k === 'SQL Server' || s.k === 'Direct Lake';
// where the object lives, in words that fit its kind (server for databases, file for workbooks, workspace for upstream models)
const locName = s => isDb(s) ? shortServer(s.s) : s.k === 'Power BI model' ? s.s : (leaf(s.s) || s.s || '(unknown)');
// sidebar group: one per database, workbook/file, or upstream model
function groupOf(s) {
  if (s.k === 'Direct Lake') return ['direct lake (onelake)', 'Direct Lake (OneLake)'];
  if (s.k === 'Power BI model') return [`pbi|${s.s}|${s.d}`.toLowerCase(), `Power BI model · ${s.s} › ${s.d}`];
  if (isDb(s)) return [`${s.d}  ·  ${shortServer(s.s)}`.toLowerCase(), `${s.d}  ·  ${shortServer(s.s).toUpperCase()}`];   // case-insensitive: BiDw = BIDW
  return [`${s.k}|${s.s}`.toLowerCase(), `${s.k} · ${leaf(s.s) || s.s || '(unknown)'}`];
}

function treeSources() {
  const q = st.q.trim().toLowerCase(), groups = new Map(), label = new Map();
  srcList().filter(i => srcHit(i, q)).forEach(i => {
    const [g, text] = groupOf(S[i]);
    if (!label.has(g)) label.set(g, text);
    (groups.get(g) || groups.set(g, []).get(g)).push(i);
  });
  const html = [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([key, ids]) => { const g = label.get(key); return (
    `<details ${q || ids.includes(st.selSrc) ? 'open' : ''}><summary>${esc(g)} <span class="note">(${ids.length})</span></summary>` +
    ids.sort((a, b) => tblName(S[a]).localeCompare(tblName(S[b]))).map(i =>
      `<div class="mi ${i === st.selSrc ? 'on' : ''}" data-s="${i}"><span class="n" title="${esc(tblName(S[i]))}">${esc(tblName(S[i]))}</span><span class="c">${visModels(i).length}</span></div>`).join('') + '</details>'); }).join('');

}

/* ---------- indicators (distinct measure names across all models) ---------- */
const VERDICTS = {Consistent: ['Consistent', 'Same logic and same source tables everywhere'], SameLogic: ['Same logic, different source', 'Identical DAX, different source tables'],
  SameSource: ['Different logic, same source', 'Same source tables, different DAX'], Both: ['Different logic and source', 'Both the DAX and the source tables differ'],
  Single: ['Single model', 'Defined in only one model']};
const vbadge = v => `<span class="badge v-${v}" title="${esc(VERDICTS[v][1])}">${VERDICTS[v][0]}</span>`;
function indicatorGroups() {
  const map = new Map();
  X.forEach((x, i) => { if (!visible(x.m) || !useful(x)) return; (map.get(x.nn) || map.set(x.nn, {key: x.nn, name: x.n, items: []}).get(x.nn)).items.push(i); });
  for (const g of map.values()) {
    const its = g.items.map(i => X[i]);
    g.models = [...new Set(its.map(x => x.m))];
    g.dv = new Set(its.map(x => x.dh)).size; g.sv = new Set(its.map(x => x.sg)).size;
    g.verdict = g.models.length < 2 ? 'Single' : g.dv === 1 && g.sv === 1 ? 'Consistent' : g.dv === 1 ? 'SameLogic' : g.sv === 1 ? 'SameSource' : 'Both';
    g.systems = [...new Set(its.flatMap(x => x.sy))].sort();
    g.reports = new Set(g.models.flatMap(m => repsOf[m]));
  }
  return [...map.values()].sort((a, b) => b.models.length - a.models.length || a.name.localeCompare(b.name));
}
const indMatch = (g, q) => !q || g.name.toLowerCase().includes(q);

function treeIndicators() {
  const q = st.q.trim().toLowerCase(), gs = indicatorGroups().filter(g => indMatch(g, q)), cap = 300;
  $('#tree').innerHTML = gs.slice(0, cap).map(g =>
    `<div class="mi ${g.key === st.selInd ? 'on' : ''}" data-i="${esc(encodeURIComponent(g.key))}"><span class="n" title="${esc(g.name)}">${esc(g.name)}</span><span class="c">${g.models.length}</span></div>`).join('') +
    (gs.length > cap ? `<p class="note">+${fmt(gs.length - cap)} more. Search to narrow.</p>` : '') || '<p class="empty">No indicator matches.</p>';
}

function barsHtml(items) {
  const max = Math.max(1, ...items.map(i => i.value));
  return '<div class="bars">' + items.map(i =>
    `<div class="row${i.attr ? ' click' : ''}" ${i.attr || ''}><span class="lbl" title="${esc(i.label)}">${esc(i.label)}</span>
      <span class="trk"><i style="width:${(100 * i.value / max).toFixed(1)}%;${i.color ? 'background:' + i.color : ''}"></i></span><span class="val">${fmt(i.value)}</span></div>`).join('') + '</div>';
}
function viewIndicatorsHome() {

  const vf = st.verdictF, rows = gs.filter(g => vf === 'all' || g.verdict === vf);
  const defs = all.reduce((a, g) => a + g.items.length, 0), described = all.reduce((a, g) => a + g.items.filter(i => X[i].d).length, 0);
  const traced = all.reduce((a, g) => a + g.items.filter(i => X[i].s.length).length, 0);
  const vcol = {Consistent: 'var(--navy)', SameLogic: 'var(--amber)', SameSource: 'var(--teal2)', Both: 'var(--red)', Single: 'var(--grey)'};
  const verdictBars = Object.keys(VERDICTS).map(k => ({label: VERDICTS[k][0], value: all.filter(g => g.verdict === k).length, color: vcol[k], attr: `data-vf="${k}"`}));

  const sysBars = Object.entries(sysCount).sort((a, b) => b[1] - a[1]).map(([k, v]) => ({label: SYS_SHORT[k] || k, value: v}));
  const topBars = multi.slice(0, 10).map(g => ({label: g.name, value: g.models.length, attr: `data-i="${esc(encodeURIComponent(g.key))}"`}));

    <div class="kpis">${[[all.length, 'Distinct indicators'], [defs, 'Measure definitions'], [multi.length, 'In 2+ models'], [conflicts.length, 'Differ in logic or source'],

      .map(([v, l]) => `<div class="kpi"><b>${typeof v === 'number' ? fmt(v) : v}</b><span>${l}</span></div>`).join('')}</div>

    <div class="wrap"><table><thead><tr><th>Indicator</th><th class="num">Models</th><th class="num">Reports on models</th><th>Source system</th><th>Verdict</th></tr></thead><tbody>
    ${rows.slice(0, 200).map(g => `<tr class="row" data-i="${esc(encodeURIComponent(g.key))}"><td class="hit"><b>${esc(g.name)}</b></td><td class="num">${g.models.length}</td><td class="num">${g.reports.size}</td>

function viewIndicator(key) {
  const g = indicatorGroups().find(o => o.key === key);

  const rank = fn => { const c = new Map(); its.forEach(o => c.set(fn(o), (c.get(fn(o)) || 0) + 1)); return [...c.entries()].sort((a, b) => b[1] - a[1]).map(e => e[0]); };
  const dax = rank(o => o.x.dh), src = rank(o => o.x.sg);
  const rows = its.map(({x}) => { const rp = repsOf[x.m];
    return `<tr class="row" data-m="${x.m}"><td>${esc(wsOf(x.m).n)}</td><td class="hit">${esc(M[x.m].n)}</td><td>${esc(x.t)}</td><td>${sysBadges(x.sy)}</td><td>${chips(x.s, 3)}</td>
      <td>${refreshInfo(x.m).html}</td><td>${rp.length ? rp.slice(0, 3).map(link).join('<br>') + (rp.length > 3 ? `<br><span class="note">+${rp.length - 3} more</span>` : '') : '<span class="note">none</span>'}</td>
      <td><b>L${dax.indexOf(x.dh) + 1}</b> <b>S${src.indexOf(x.sg) + 1}</b></td><td>${x.d ? '✓' : '—'}</td></tr>`; }).join('');

    return `<div><b>L${n + 1}</b> · ${grp.length} model${grp.length > 1 ? 's' : ''}: <span class="note">${esc(grp.map(o => M[o.x.m].n).slice(0, 6).join(', '))}${grp.length > 6 ? '…' : ''}</span><pre class="code">${esc(grp[0].x.dax)}</pre></div>`; }).join('');
  const sources = src.map((sg, n) => { const grp = its.filter(o => o.x.sg === sg);
    return `<div style="margin:6px 0"><b>S${n + 1}</b> · ${grp.length} model${grp.length > 1 ? 's' : ''}: ${sysBadges(grp[0].x.sy)} ${chips(grp[0].x.s, 8)}
      <div class="note">${esc(grp.map(o => M[o.x.m].n).slice(0, 6).join(', '))}${grp.length > 6 ? '…' : ''}</div></div>`; }).join('');
  const reps = [...g.reports].sort((a, b) => R[a].n.localeCompare(R[b].n));
  return `${backBtn('Back to indicators summary')}<div class="crumb">Indicator</div><h2>${esc(g.name)}</h2>
    <p>${vbadge(g.verdict)} <span class="note">${esc(VERDICTS[g.verdict][1])}</span></p>
    <div class="flow">

      ${reps.slice(0, 300).map(r => `<tr><td>${link(r)}</td><td>${esc((W[R[r].w] || {n: ''}).n)}</td><td>${esc(M[R[r].m].n)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="note">None.</p>'}</div>`;
}

/* ---------- reports ---------- */
const repWs = ri => W[R[ri].w] || {n: '(unknown)', test: false};
const repVisible = ri => !(st.hideTest && repWs(ri).test) && slReport(ri);
const REP_CATS = ['Last refresh OK', 'Last refresh failed', 'Last refresh other', 'No refresh history', 'Live / not refreshable', 'No model'];
const CAT_COLOR = {'Last refresh OK': 'var(--navy)', 'Last refresh failed': 'var(--red)', 'Last refresh other': 'var(--amber)',
  'No refresh history': 'var(--amber)', 'Live / not refreshable': 'var(--grey)', 'No model': 'var(--grey)'};
const repList = () => R.map((_, i) => i).filter(repVisible);
function repFacts(ri) {
  const r = R[ri], m = r.m >= 0 ? M[r.m] : null, rf = m ? (m.rf || {}) : {};
  let cat = 'No model';
  if (m) cat = !m.rfs ? 'Live / not refreshable' : !rf.hc ? 'No refresh history' : rf.ls === 'Completed' ? 'Last refresh OK' : rf.ls === 'Failed' ? 'Last refresh failed' : 'Last refresh other';
  const sched = !m ? '' : !m.rfs ? 'Not scheduled (live connection)' : rf.sched === 'Off' ? 'Scheduled refresh off' : (rf.sched || 'Schedule unknown');
  return {ri, r, m, rf, cat, sched, owner: D.owners && m ? (m.by || '') : ''};
}
const openLink = r => r.u ? `<a href="${esc(r.u)}" target="_blank" rel="noopener">Open report ↗</a>` : '<span class="note">no link</span>';

function treeReports() {
  const q = st.q.trim().toLowerCase(), groups = new Map();
  repList().forEach(ri => {
    const r = R[ri], f = repFacts(ri);
    if (q && ![r.n, repWs(ri).n, f.m ? f.m.n : ''].some(v => v.toLowerCase().includes(q))) return;
    (groups.get(r.w) || groups.set(r.w, []).get(r.w)).push(ri);
  });
  const html = [...groups.entries()].sort((a, b) => (W[a[0]]?.n || '').localeCompare(W[b[0]]?.n || '')).map(([w, ids]) =>
    `<details ${q || ids.includes(st.selRep) ? 'open' : ''}><summary>${esc(W[w]?.n || '(unknown)')} <span class="note">(${ids.length})</span></summary>` +
    ids.sort((a, b) => R[a].n.localeCompare(R[b].n)).map(ri => { const f = repFacts(ri);
      return `<div class="mi ${ri === st.selRep ? 'on' : ''}" data-r="${ri}"><span class="n" title="${esc(R[ri].n)}"><i class="dot ${f.m ? refreshInfo(R[ri].m).dot : ''}"></i>${esc(R[ri].n)}</span></div>`; }).join('') + '</details>').join('');
  $('#tree').innerHTML = html || '<p class="empty">No report matches.</p>';
}

function viewReportsHome() {
  const q = st.q.trim().toLowerCase(), all = repList().map(repFacts);
  const count = {}; all.forEach(f => count[f.cat] = (count[f.cat] || 0) + 1);
  const rows = all.filter(f => (st.repCat === 'all' || f.cat === st.repCat) &&
    (!q || [f.r.n, repWs(f.ri).n, f.m ? f.m.n : '', f.owner].some(v => String(v).toLowerCase().includes(q))))
    .sort((a, b) => repWs(a.ri).n.localeCompare(repWs(b.ri).n) || a.r.n.localeCompare(b.r.n));
  const wsCount = new Map(); all.forEach(f => wsCount.set(f.r.w, (wsCount.get(f.r.w) || 0) + 1));
  const wsBars = [...wsCount.entries()].sort((a, b) => b[1] - a[1]).slice(0, 10).map(([w, v]) => ({label: W[w]?.n || '(unknown)', value: v}));
  const catBars = REP_CATS.filter(c => count[c]).map(c => ({label: c, value: count[c], color: CAT_COLOR[c], attr: `data-rc="${esc(c)}"`}));
  const sched = all.filter(f => f.m && f.m.rfs && f.rf.sched && f.rf.sched !== 'Off').length;
  const off = all.filter(f => f.m && f.m.rfs && (!f.rf.sched || f.rf.sched === 'Off')).length;
  return `${q || st.repCat !== 'all' ? backBtn('Clear search and filters') : ''}<h2>Reports</h2>
    <p class="sub">Every Power BI report with who owns its data, when that data last refreshed, how it is scheduled, and a link to open it. Pick a report on the left, or filter below.</p>
    <div class="kpis">${[[all.length, 'Reports'], [count['Last refresh OK'] || 0, 'Model refreshed OK'], [count['Last refresh failed'] || 0, 'Last refresh failed'],
      [sched, 'On a refresh schedule'], [off, 'Refreshable, schedule off'], [count['Live / not refreshable'] || 0, 'Live connection']]
      .map(([v, l]) => `<div class="kpi"><b>${fmt(v)}</b><span>${l}</span></div>`).join('')}</div>
    <div class="grid2"><div><h3>Model refresh status (reports)</h3>${barsHtml(catBars)}</div><div><h3>Reports by workspace</h3>${barsHtml(wsBars)}</div></div>
    <h3>All reports</h3>
    <div class="filters"><button data-rc="all" class="${st.repCat === 'all' ? 'on' : ''}">All (${fmt(all.length)})</button>${REP_CATS.filter(c => count[c]).map(c =>
      `<button data-rc="${esc(c)}" class="${st.repCat === c ? 'on' : ''}">${esc(c)} (${count[c]})</button>`).join('')}</div>
    <div class="wrap"><table><thead><tr><th>Workspace</th><th>Report</th><th>Model</th>${D.owners ? '<th>Owner</th>' : ''}<th>Last refreshed</th><th>Schedule</th><th>Link</th></tr></thead><tbody>
    ${rows.slice(0, 200).map(f => `<tr class="row" data-r="${f.ri}"><td>${esc(repWs(f.ri).n)}</td><td class="hit"><b>${esc(f.r.n)}</b></td><td>${f.m ? esc(f.m.n) : '<span class="note">none</span>'}</td>
      ${D.owners ? `<td>${esc(f.owner || '—')}</td>` : ''}<td>${f.m ? refreshInfo(f.r.m).html : '—'}</td><td>${esc(f.sched)}</td><td style="white-space:nowrap">${openLink(f.r)}</td></tr>`).join('')}</tbody></table></div>
    <p class="note">${fmt(rows.length)} report${rows.length === 1 ? '' : 's'}${rows.length > 200 ? '; first 200 shown, refine the search or filter' : ''}. Owner is the person who configured the report's data model; Power BI does not store an owner on the report itself.</p>`;
}

function viewReport(ri) {
  const f = repFacts(ri), r = f.r, m = f.m, rf = f.rf, mi = r.m;
  const others = mi >= 0 ? repsOf[mi].filter(o => o !== ri) : [];

    <h2>${esc(r.n)}</h2>
    <p>${r.u ? `<a class="open-link" href="${esc(r.u)}" target="_blank" rel="noopener">Open report ↗</a>` : '<span class="note">No link available</span>'}</p>
    <div class="flow">
      <div><b style="font-size:17px">${esc(D.owners ? (f.owner || 'Not recorded') : 'Not included')}</b><span>Owner (person who configured the data model)</span></div>
      <div><b style="font-size:17px">${m ? esc(rf.lt || (m.rfs ? 'No successful refresh' : 'Live')) : '—'}</b><span>Model last successfully refreshed</span></div>
      <div><b style="font-size:17px">${esc(f.sched || '—')}</b><span>Refresh schedule</span></div>

        ${row('Schedule', esc(f.sched || '—'))}

        ${row('Last refresh result', m && rf.ls ? esc(rf.ls) : '—')}

    <div class="sec"><h3>Data model</h3>

        ${row('Source systems', m ? sysBadges(modelSystems(mi)) : '—')}
        ${row('Indicators on the model', m ? `${fmt(nInd)} <span class="note">(open the model to list them)</span>` : '—')}
        ${row('Other reports on this model', others.length ? others.slice(0, 12).map(link).join(', ') + (others.length > 12 ? ` <span class="note">+${others.length - 12} more</span>` : '') : '<span class="note">none</span>')}
      </tbody></table></div></div>`;
}

/* ---------- sidebar ---------- */
function renderTreeModels() {
  const hit = search();
  const byWs = new Map();
  M.forEach((m, mi) => {
    if (!visible(mi) || (hit && !hit.models.has(mi))) return;
    (byWs.get(m.w) || byWs.set(m.w, []).get(m.w)).push(mi);
  });
  const html = [...byWs.entries()].sort((a, b) => (W[a[0]]?.n || '').localeCompare(W[b[0]]?.n || '')).map(([w, ids]) =>
    `<details ${hit || ids.includes(st.sel) ? 'open' : ''}><summary>${esc(W[w]?.n || '(unknown)')} <span class="note">(${ids.length})</span></summary>` +
    ids.sort((a, b) => M[a].n.localeCompare(M[b].n)).map(mi =>
      `<div class="mi ${mi === st.sel ? 'on' : ''}" data-m="${mi}"><span class="n"><i class="dot ${refreshInfo(mi).dot}"></i>${esc(M[mi].n)}</span><span class="c">${measOf[mi].length}</span></div>`).join('') +
    '</details>').join('');
  $('#tree').innerHTML = html || '<p class="empty">No model matches.</p>';
}

/* ---------- landing ---------- */
function viewHome() {
  const hit = search();
  const ms = M.map((_, i) => i).filter(visible);
  const nTab = ms.reduce((a, mi) => a + tabsOf[mi].filter(t => slTbl(T[t])).length, 0);
  const nMeas = ms.reduce((a, mi) => a + measOf[mi].filter(i => slInd(X[i])).length, 0);
  const srcSet = new Set(); ms.forEach(mi => M[mi].s.forEach(s => srcSet.add(s)));
  const sysCount = {}; ms.forEach(mi => (modelSystems(mi).length ? modelSystems(mi) : ['none']).forEach(k => sysCount[k] = (sysCount[k] || 0) + 1));
  const bars = Object.entries(sysCount).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...bars.map(b => b[1]));
  let out = `${st.q.trim() ? backBtn('Clear search') : ''}<h2>Semantic models</h2><p class="sub">Pick a semantic model on the left, or search above for a model, a table or an indicator.</p>
    <div class="kpis">${[[ms.length, 'Models'], [nTab, 'Tables'], [nMeas, 'Measures'], [srcSet.size, 'Distinct source objects'],
      [R.length, 'Reports']].map(([v, l]) => `<div class="kpi"><b>${fmt(v)}</b><span>${l}</span></div>`).join('')}</div>`;
  if (hit && hit.meas.length) {
    const rows = hit.meas.slice(0, 200).map(i => { const x = X[i];
      return `<tr class="row" data-m="${x.m}"><td><b>${esc(x.n)}</b></td><td>${esc(wsOf(x.m).n)}</td><td class="hit">${esc(M[x.m].n)}</td><td>${esc(x.t)}</td>
        <td>${sysBadges(x.sy)}</td><td class="num">${repsOf[x.m].length}</td></tr>`; }).join('');
    out += `<div class="sec"><h3>Indicators matching “${esc(st.q)}” (${hit.meas.length})</h3>
      <p class="note">Each row is one definition of the indicator. Reports are the ones built on that model, so the indicator is available to them; which pages show it is not harvested. Click a row to open the model.</p>
      <div class="wrap"><table><thead><tr><th>Indicator</th><th>Workspace</th><th>Model</th><th>Table</th><th>Source system</th><th class="num">Reports on model</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${hit.meas.length > 200 ? '<p class="note">First 200 shown; refine the search.</p>' : ''}</div>`;
  }
  out += `<div class="sec"><h3>Models by source system</h3><div class="bars">${bars.map(([k, v]) =>
    `<div class="row"><span class="lbl">${esc(SYS_SHORT[k] || k)}</span><span class="trk"><i style="width:${100 * v / max}%"></i></span><span class="val">${v}</span></div>`).join('')}</div></div>`;
  return out;
}

/* ---------- model view ---------- */
function descHtml(x) {
  if (x.ds) return `<p>${esc(x.d)}</p><p class="note">${x.ds === 'owner' ? 'Owner-approved description.' : 'Description stored in the model.'}</p>`;
  if (x.pd) return `<p>${esc(x.pd)}</p><p class="note">Proposed description, not yet reviewed by an owner (${esc(x.pc)} confidence${x.ps === 'propagated' ? '; reused from an identical measure in another model' : ''}).${x.pn ? ' To confirm: ' + esc(x.pn) : ''}</p>`;
  return '<p class="note">No description.</p>';
}
function viewModel(mi) {
  const m = M[mi], ws = wsOf(mi), ri = refreshInfo(mi);
  const tabs = tabsOf[mi].map(i => T[i]).filter(slTbl), meas = measOf[mi].map(i => X[i]).filter(useful);
  const reps = repsOf[mi].filter(slReport);
  const allSrc = m.s.map(s => ({s, tables: tabs.filter(t => t.s.includes(s)).length, ind: meas.filter(x => x.s.includes(s)).length}))
    .sort((a, b) => b.ind - a.ind);
  const srcRows = allSrc.filter(r => S[r.s].k !== 'Power BI model');
  const upstream = new Map();   // upstream model (index or name) -> {tables used, measures}
  allSrc.filter(r => S[r.s].k === 'Power BI model').forEach(r => { const s = S[r.s], key = s.um >= 0 ? 'm' + s.um : s.s + '›' + s.d;
    const e = upstream.get(key) || upstream.set(key, {s, um: s.um, tables: [], ind: 0}).get(key); e.tables.push(s.o); e.ind += r.ind; });
  const described = meas.filter(x => x.ds).length, proposedOnly = meas.filter(x => !x.ds && x.pd).length;
  const descCat = x => x.ds === 'owner' ? 'owner' : x.ds ? 'model' : x.pd ? 'proposed' : 'none';
  const mfilter = st.mq.toLowerCase();
  const tnames = [...new Set(meas.map(x => x.t))].sort();
  const shown = meas.filter(x => (st.tableFilter === 'all' || x.t === st.tableFilter) && (st.descFilter === 'all' || descCat(x) === st.descFilter) && (!mfilter || x.n.toLowerCase().includes(mfilter)));
  const full = st.mview === 'full';
  const descMark = x => `<td title="${{owner: 'Owner-approved', model: 'Description in the model', proposed: 'Proposed, not yet reviewed', none: 'No description'}[descCat(x)]}">${{owner: '✓✓', model: '✓', proposed: '~', none: '—'}[descCat(x)]}</td>`;
  const mrows = shown.slice(0, st.limit).map(x => {
    const open = st.openM === X.indexOf(x);
    const head = `<tr class="row ${open ? 'open' : ''}" data-x="${X.indexOf(x)}" style="vertical-align:top"><td><b>${esc(x.n)}</b>${x.h ? ' <span class="note">(hidden)</span>' : ''}</td><td>${esc(x.t)}</td><td>${esc(x.f || '')}</td>
      <td>${sysBadges(x.sy)}</td>`;
    if (full) {
      const text = x.ds ? x.d : x.pd || '', cat = descCat(x), clamp = open ? '' : 'max-height:6.4em;overflow:hidden;';
      const label = {owner: 'Owner-approved', model: 'In the model', proposed: 'Proposed, not yet reviewed' + (x.pc ? ' (' + x.pc + ' confidence)' : ''), none: ''}[cat];
      return head + `<td style="min-width:280px"><div style="${clamp}">${text ? esc(text) : '<span class="note">No description.</span>'}</div>${label ? `<div class="note">${descMark(x).match(/>(.*)<\/td>/)[1]} ${esc(label)}${open && x.pn ? ' · To confirm: ' + esc(x.pn) : ''}</div>` : ''}</td>
        <td style="min-width:180px">${chips(x.s, open ? 99 : 3)}</td>
        <td style="min-width:300px"><pre class="code" style="margin:0;white-space:pre-wrap;word-break:break-word;${open ? 'max-height:none' : 'max-height:6.4em;overflow:hidden'}">${esc(x.dax)}</pre></td></tr>`;
    }
    return head + descMark(x) + `</tr>` +
      (open ? `<tr class="detail"><td colspan="5">${descHtml(x)}
        <div><b>Source tables:</b> ${chips(x.s, 6)}</div><pre class="code">${esc(x.dax)}</pre></td></tr>` : ''); }).join('');
  return `${backBtn('Back to semantic models summary')}<div class="crumb">${esc(ws.n)}${ws.test ? ' · test / dev workspace' : ''}</div>
    <h2>${esc(m.n)}</h2>
    <p>${ri.html} <span class="note">· ${esc(m.mode)} storage${D.owners && m.by ? ` · configured by ${esc(m.by)}` : ''}${m.rf && m.rf.am ? ` · average refresh ${m.rf.am} min` : ''}</span></p>
    <div class="flow">
      <div><b>${modelSystems(mi).length ? sysBadges(modelSystems(mi)) : sysBadge('none')}</b><span>1. Sources: ${srcRows.length} distinct source object${srcRows.length === 1 ? '' : 's'}</span></div>
      <div><b>${tabs.length}</b><span>2. Tables in this model</span></div>
      <div><b>${fmt(meas.length)}</b><span>3. Measures (${pct(described, meas.length)} described${proposedOnly ? ` · ${pct(proposedOnly, meas.length)} proposed` : ''}) · ${reps.length} report${reps.length === 1 ? '' : 's'} built on it</span></div>
    </div>

    <div class="sec"><h3>Where the data comes from (${srcRows.length})</h3>
      ${srcRows.length ? `<div class="wrap"><table><thead><tr><th>System</th><th>Type</th><th>Server / location</th><th>Database</th><th>Schema</th><th>Table / object</th><th class="num">Tables</th><th class="num">Measures</th></tr></thead><tbody>
      ${srcRows.map(r => { const s = S[r.s]; return `<tr><td>${sysBadge(s.y)}</td><td>${esc(s.k)}</td><td title="${esc(s.s)}">${esc(s.s.length > 44 ? '…' + s.s.slice(-42) : s.s)}</td>
        <td>${esc(s.d)}</td><td>${esc(s.sc || '')}</td><td><b>${esc(s.t || s.o)}</b>${s.nq ? ' <span class="note">(custom query)</span>' : ''}</td><td class="num">${r.tables}</td><td class="num">${r.ind}</td></tr>`; }).join('')}
      </tbody></table></div>` : '<p class="note">No database, file or web source found (calculated, manual or date tables only).</p>'}</div>
    ${upstream.size ? `<div class="sec"><h3>Upstream Power BI models (${upstream.size})</h3>
      <p class="note">This model reads these published models through DirectQuery, so its numbers depend on them. Click one to open it.</p>
      <div class="wrap"><table><thead><tr><th>Upstream workspace</th><th>Upstream model</th><th>Tables used</th><th class="num">Measures</th></tr></thead><tbody>
      ${[...upstream.values()].map(u => `<tr ${u.um >= 0 ? `class="row" data-m="${u.um}"` : ''}><td>${esc(u.um >= 0 ? wsOf(u.um).n : u.s.s)}</td>
        <td ${u.um >= 0 ? 'class="hit"' : ''}>${esc(u.s.d)}${u.um >= 0 ? '' : ' <span class="note">(not harvested)</span>'}</td>
        <td>${esc([...new Set(u.tables)].join(', '))}</td><td class="num">${u.ind}</td></tr>`).join('')}</tbody></table></div></div>` : ''}

    <div class="sec"><h3>Tables (${tabs.length})</h3>
      <div class="wrap"><table><thead><tr><th>Table</th><th>Type</th><th>Loads from</th><th>Query / expression</th></tr></thead><tbody>
      ${tabs.map(t => `<tr><td>${esc(t.n)}${t.h ? ' <span class="note">(hidden)</span>' : ''}</td><td>${esc(t.k)}</td><td>${chips(t.s, 3)}</td>
        <td>${t.c ? `<details><summary>show</summary><pre class="code">${esc(t.c)}</pre></details>` : '<span class="note">—</span>'}</td></tr>`).join('')}
      </tbody></table></div></div>

    <div class="sec"><h3>Measures (${fmt(shown.length)}${shown.length !== meas.length ? ' of ' + fmt(meas.length) : ''})</h3>
      <div class="filters"><input type="search" id="mq" placeholder="Filter measures…" value="${esc(st.mq)}">
        <select id="tf"><option value="all">All tables</option>${tnames.map(n => `<option ${st.tableFilter === n ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
        <select id="df">${[['all', 'Any description'], ['owner', 'Owner-approved'], ['model', 'In the model'], ['proposed', 'Proposed only'], ['none', 'No description']].map(([v, l]) => `<option value="${v}" ${st.descFilter === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <select id="mv">${[['full', 'Full table (description, sources, logic)'], ['compact', 'Compact (click a row for detail)']].map(([v, l]) => `<option value="${v}" ${st.mview === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <p class="note">${full ? 'Click a row to expand its full description, source tables and logic. ' : ''}Described: ✓✓ owner-approved · ✓ already in the model · ~ proposed from the measure's logic, not yet reviewed by an owner · — none.</p>
      <div class="wrap"><table><thead><tr><th>Measure</th><th>Table</th><th>Folder</th><th>Source system</th>${full ? '<th>Description</th><th>Source tables</th><th>Logic (DAX)</th>' : '<th>Description</th>'}</tr></thead><tbody>${mrows}</tbody></table></div>
      ${shown.length > st.limit ? `<div class="more"><button class="ghost" id="more">Show more</button> <span class="note">${fmt(st.limit)} of ${fmt(shown.length)} shown</span></div>` : ''}</div>

    <div class="sec"><h3>Reports built on this model (${reps.length})</h3>
      ${reps.length ? `<div class="wrap"><table><thead><tr><th>Report</th><th>Workspace</th></tr></thead><tbody>
      ${reps.map(r => `<tr><td>${link(r)}</td><td>${esc((W[R[r].w] || {n: ''}).n)}</td></tr>`).join('')}</tbody></table></div>
      <p class="note">These reports read this model, so every measure above is available to them. Which measures each report actually shows is not harvested.</p>` : '<p class="note">No report reads this model.</p>'}</div>`;
}

/* ---------- shell ---------- */
const MODES = [['models', 'Semantic Models'], ['reports', 'Reports'], ['tables', 'Tables'], ['indicators', 'Measures / Indicators']];
// header title and strapline follow the active tab
const HEAD = {
  models: ['Semantic Models', 'Every semantic model with its tables, measures and the reports built on it. Search an indicator to see which semantic models and reports carry it.'],
  reports: ['Reports', 'Every Power BI report with its owner, last refresh, refresh schedule and a link to open it.'],
  tables: ['Tables', 'Every table, view, file and upstream model the semantic models load from, and the measures and reports that depend on it.'],
  indicators: ['Measures / Indicators', 'Every measure (indicator): where it is defined, how it differs between semantic models, and where its data comes from.'],
};
const renderTree = () => ({models: renderTreeModels, reports: treeReports, tables: treeSources, indicators: treeIndicators})[st.mode]();
const mainHtml = () => st.mode === 'reports' ? (st.selRep >= 0 ? viewReport(st.selRep) : viewReportsHome())
  : st.mode === 'tables' ? (st.selSrc >= 0 ? viewSource(st.selSrc) : viewSourcesHome())
  : st.mode === 'indicators' ? (st.selInd ? viewIndicator(st.selInd) : viewIndicatorsHome())
  : (st.sel >= 0 ? viewModel(st.sel) : viewHome());
$('#q').placeholder = 'Search…';
function render() {
  // a slicer change can hide the open item: fall back to the landing page
  if (st.sel >= 0 && !visible(st.sel)) st.sel = -1;
  if (st.selSrc >= 0 && !srcList().includes(st.selSrc)) st.selSrc = -1;
  if (st.selInd && !indicatorGroups().some(g => g.key === st.selInd)) st.selInd = '';
  if (st.selRep >= 0 && !repVisible(st.selRep)) st.selRep = -1;
  $('#hTitle').textContent = 'Indicator Library: ' + HEAD[st.mode][0]; $('#hSub').textContent = HEAD[st.mode][1]; document.title = 'Indicator Library: ' + HEAD[st.mode][0];
  $('#modes').innerHTML = MODES.map(([k, l]) => `<button data-mode="${k}" class="${st.mode === k ? 'on' : ''}">${l}</button>`).join('');
  $('#q').placeholder = {models: 'Search semantic models, tables or indicators…', reports: 'Search reports, workspaces, models or owners…', tables: 'Search tables, files, databases or servers…', indicators: 'Search measures / indicators…'}[st.mode];
  renderTree();
  $('#main').innerHTML = mainHtml();
}
document.addEventListener('click', e => {
  if (e.target.closest('a[href]')) return;   // real links (Open report) must just open
  if (e.target.closest('[data-back]')) { goHome(); return; }
  const rc = e.target.closest('[data-rc]');
  if (rc) { st.repCat = rc.dataset.rc; render(); return; }
  const ri = e.target.closest('[data-r]');
  if (ri) { goReport(+ri.dataset.r); return; }
  const md = e.target.closest('[data-mode]');
  if (md && md.dataset.mode === st.mode) { goHome(); return; }
  if (md) { st.mode = md.dataset.mode; st.q = ''; $('#q').value = ''; if (location.hash) history.replaceState(null, '', location.pathname + location.search); render(); window.scrollTo(0, 0); return; }
  const vf = e.target.closest('[data-vf]');
  if (vf) { st.verdictF = vf.dataset.vf; render(); return; }
  const si = e.target.closest('[data-s]');
  if (si) { goSource(+si.dataset.s); return; }
  const ii = e.target.closest('[data-i]');
  if (ii) { goInd(decodeURIComponent(ii.dataset.i)); return; }
  const m = e.target.closest('[data-m]');
  if (m) { goModel(+m.dataset.m); return; }
  const x = e.target.closest('[data-x]');
  if (x) { st.openM = st.openM === +x.dataset.x ? null : +x.dataset.x; render(); return; }
  if (e.target.id === 'more') { st.limit += 150; render(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'mv') { st.mview = e.target.value; st.openM = null; render(); }
  if (e.target.id === 'df') { st.descFilter = e.target.value; st.limit = 150; render(); }
  if (e.target.id === 'tf') { st.tableFilter = e.target.value; st.limit = 150; render(); }
  else if (e.target.id === 'kind') { st.kind = e.target.value; render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') {
    st.q = e.target.value;
    if (st.q.trim()) {  // show search results instead of the open item
      st.sel = -1; st.selSrc = -1; st.selInd = ''; st.selRep = -1;
      if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    }
    renderTree(); $('#main').innerHTML = mainHtml();
  }
  else if (e.target.id === 'mq') { st.mq = e.target.value; st.limit = 150; const pos = e.target.selectionStart; render(); const el = $('#mq'); el.focus(); el.setSelectionRange(pos, pos); }
});
function readHash() {
  const h = location.hash, m = /^#m=(\d+)/.exec(h), s = /^#s=(\d+)/.exec(h), i = /^#i=(.+)/.exec(h), rp = /^#r=(\d+)/.exec(h);
  if (m && M[+m[1]]) { st.mode = 'models'; st.sel = +m[1]; }
  else if (rp && R[+rp[1]]) { st.mode = 'reports'; st.selRep = +rp[1]; }
  else if (s && S[+s[1]]) { st.mode = 'tables'; st.selSrc = +s[1]; }
  else if (i) { st.mode = 'indicators'; st.selInd = decodeURIComponent(i[1]); }
}
window.addEventListener('hashchange', () => { st.sel = -1; st.selSrc = -1; st.selInd = ''; st.selRep = -1; readHash(); render(); });
readHash();
$('#meta').textContent = `Generated ${D.generated} · ${W.length} workspaces · ${M.length} models · ${R.length} reports · ${fmt(X.length)} measure definitions`;
$('#foot').textContent = 'Metadata only: model definitions, refresh status and aggregate counts. No customer or row-level data is included. ' +
  (D.owners ? 'Model owner addresses are shown. ' : '') + 'Server and database names are internal, so keep this file inside the organization.';
// left pane: drag the divider to resize, double-click it to widen or reset, use the arrow to collapse
const LAYOUT = $('#layout'), SIDE_KEY = 'indicatorLibrary.leftPane';
let sideW = 330, sideCollapsed = false;
try {
  const saved = JSON.parse(localStorage.getItem(SIDE_KEY) || 'null');
  if (saved) { sideW = Math.min(Math.max(+saved.w || 330, 220), Math.round(innerWidth * 0.7)); sideCollapsed = !!saved.c; }
} catch (err) { /* storage unavailable: use the defaults */ }
const saveSide = () => { try { localStorage.setItem(SIDE_KEY, JSON.stringify({w: sideW, c: sideCollapsed})); } catch (err) { /* ignore */ } };
function applySide() {
  LAYOUT.style.setProperty('--side-w', sideW + 'px');
  LAYOUT.classList.toggle('collapsed', sideCollapsed);
  $('#sideToggle').textContent = sideCollapsed ? '›' : '‹';
}
$('#sideToggle').addEventListener('click', () => { sideCollapsed = !sideCollapsed; applySide(); saveSide(); });
$('#rz').addEventListener('mousedown', e => {
  if (e.target.id === 'sideToggle' || sideCollapsed) return;
  e.preventDefault();
  const startX = e.clientX, startW = sideW;
  const move = ev => { sideW = Math.min(Math.max(startW + ev.clientX - startX, 220), Math.round(innerWidth * 0.7)); applySide(); };
  const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); document.body.style.cursor = ''; saveSide(); };
  document.addEventListener('mousemove', move); document.addEventListener('mouseup', up); document.body.style.cursor = 'col-resize';
});
$('#rz').addEventListener('dblclick', e => {
  if (e.target.id === 'sideToggle') return;
  sideW = sideW < 500 ? Math.min(620, Math.round(innerWidth * 0.7)) : 330; sideCollapsed = false; applySide(); saveSide();
});
applySide();

slApply(); renderSlicers();
render();
</script>
</body>
</html>
